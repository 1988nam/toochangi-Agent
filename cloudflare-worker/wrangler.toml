# 투챙이 KIS 중계 프록시 Worker 배포 설정
# 배포:  cd cloudflare-worker && npx wrangler deploy
# (대시보드 복사-붙여넣기 대신 이 설정으로 재현 가능하게 배포)
name = "toochangi-kis"
main = "kis-proxy.js"
compatibility_date = "2024-11-01"

# 보안 옵션(선택):
#  - 허용 출처 추가:  npx wrangler secret put ALLOWED_ORIGINS   (쉼표구분, 기본 목록에 추가됨)
#  - 공유 토큰 잠금 :  npx wrangler secret put PROXY_TOKEN      (앱 localStorage:toochangi_kis_proxy_token 와 동일 값)
